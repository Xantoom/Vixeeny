[workspace]
resolver = "3"
members = ["xtask", "crates/*"]

[workspace.package]
version = "0.9.9"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/Xantoom/Vixeeny"

[workspace.dependencies]
# Versions pinned at M0 (latest stable on crates.io, 2026-10-01). See VIXEENY_PLAN.md section 14.
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
directories = "6.0.0"
insta = "1.48.0"
interprocess = "2.4.4"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
tracing-appender = "0.2.5"
tray-icon = { version = "0.26.0", default-features = false }
global-hotkey = { version = "0.8.0", default-features = false }
auto-launch = "0.6.0"
windows = "0.62.2"
tiny-skia = "0.12.0"
fontdue = "0.9.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"

# Development builds: line tables are enough for backtraces and panics; full debug info made every
# test binary of vixeeny-ui about 200 MB and the build folder tens of gigabytes.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
