[workspace]
resolver = "3"
members = ["xtask", "crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/Xantoom/Vixeeny"

[workspace.dependencies]
# Versions pinned at M0 (latest stable on crates.io, 2026-10-01). See VIXEENY_PLAN.md section 14.
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
postcard = { version = "1.1.3", features = ["use-std"] }
directories = "6.0.0"
insta = "1.48.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
