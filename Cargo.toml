[workspace]
resolver = "3"
members = ["xtask", "crates/*"]

[workspace.package]
version = "0.22.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Xantoom/Vixeeny"

[workspace.dependencies]
# Versions pinned (latest stable on crates.io when added).
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
directories = "6.0.0"
insta = "1.49.0"
interprocess = "2.4.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
tray-icon = { version = "0.26.1", default-features = false }
global-hotkey = { version = "0.9.0", default-features = false }
windows = "0.62.2"
tiny-skia = "0.12.0"
fontdue = "0.9.4"
rayon = "1.12.0"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
winresource = "0.1.34"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"

# Development builds: line tables are enough for backtraces and panics; full debug info made every
# test binary of vixeeny-ui about 200 MB and the build folder tens of gigabytes.
[profile.dev]
debug = "line-tables-only"

# The dependencies need no debug info: much smaller and faster to link.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The interface's generated code is not where the time goes: built in parallel, it compiles in
# half the time for a slightly larger program.
[profile.release.package.vixeeny-ui]
codegen-units = 16
