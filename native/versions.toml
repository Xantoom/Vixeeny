url = "https://github.com/libjpeg-turbo/libjpeg-turbo"
tag = "3.1.4.1"
commit = "9217719d3a58633923b096af4c1d50d304768a64"
license = "IJG, BSD-3-Clause and zlib"

[libultrahdr]
# JPEG Ultra HDR: an SDR JPEG with a gain map.
