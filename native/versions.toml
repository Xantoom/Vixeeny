# Pinned native libraries.
# Every library is fetched by exact commit; `tag` is informational. Versions resolved 2026-11-21.
#
# `cargo xtask build-native` reads this file, so keep the keys stable.

[ffmpeg]
# Built by packaging/ffmpeg/build.sh from the BtbN GPL image (image and commit pinned there):
# FFmpeg n9.1 with only what Vixeeny uses (its encoders, decoders, containers and
# filters), x264, x265, SVT-AV1, libaom (AVIF), libvpx, dav1d, opus, NVENC, AMF, QSV and D3D11VA
# decoding. The CI builds it when its cache has none (.github/workflows/ffmpeg.yml); `cargo xtask build-native` unpacks the zip.
tag = "n9.1"
license = "GPL-3.0-or-later (--enable-gpl --enable-version3, no nonfree); bundles x264 and x265 (GPL-2.0-or-later), libvpx and opus (BSD-3-Clause), SVT-AV1 (BSD-3-Clause-Clear, AOM patent licence), libaom (BSD-2-Clause, AOM patent licence) and dav1d (BSD-2-Clause)"

[libwebp]
# Not built here: the libwebp-sys crate compiles its own copy of this release. Listed for its
# licence (THIRD-PARTY-LICENSES.txt).
url = "https://github.com/webmproject/libwebp"
tag = "v1.6.0"
commit = "b7e29b9d75bd31422b00c2a446d49d7af06c328d"
license = "BSD-3-Clause"

[libjxl]
url = "https://github.com/libjxl/libjxl"
tag = "v0.13.0"
commit = "5a7da83447212fe4900fc29ce97430b881caa67e"
license = "BSD-3-Clause"

[jpegli]
url = "https://github.com/google/jpegli"
tag = "HEAD as of 2026-11-18 (no release tags)"
commit = "c7d342c25d3587ac0110c915989ad94f414b6c8d"
license = "BSD-3-Clause"

[libjpeg-turbo]
# The libjpeg of libultrahdr (decoding the SDR picture, encoding the gain map). The JPEG
# screenshots themselves are jpegli's.
url = "https://github.com/libjpeg-turbo/libjpeg-turbo"
tag = "3.2.1"
commit = "7b4993786d856cbccabfc0ed2f923ba000e326cc"
license = "IJG, BSD-3-Clause and zlib"

[libultrahdr]
# JPEG Ultra HDR: an SDR JPEG with a gain map.
url = "https://github.com/google/libultrahdr"
tag = "v2.0.2"
commit = "e5f5a022fe96fc4dc2ee35c19f733a50df807abe"
license = "Apache-2.0"
