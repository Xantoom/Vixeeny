# Pinned native libraries.
# Every library is fetched by exact commit; `tag` is informational. Versions resolved 2026-10-01.
#
# `cargo xtask build-native` reads this file, so keep the keys stable.

[ffmpeg]
# Built by packaging/ffmpeg/build.sh from the BtbN GPL image (image and commit pinned there):
# FFmpeg n9.0.2-22-g46d8f462ee with only what Vixeeny uses (its encoders, decoders, containers and
# filters), x264, x265, SVT-AV1 (video and AVIF), libvpx, dav1d, opus, NVENC, AMF, QSV and D3D11VA
# decoding. The CI builds it when its cache has none (.github/workflows/ffmpeg.yml); `cargo xtask build-native` unpacks the zip.
tag = "n9.0.2"
license = "GPL-3.0-or-later (--enable-gpl --enable-version3, no nonfree); bundles x264 and x265 (GPL-2.0-or-later), libvpx and opus (BSD-3-Clause), SVT-AV1 (BSD-3-Clause-Clear, AOM patent licence) and dav1d (BSD-2-Clause)"

[libwebp]
# Not built here: the libwebp-sys crate compiles its own copy of this release. Listed for its
# licence (THIRD-PARTY-LICENSES.txt).
url = "https://github.com/webmproject/libwebp"
tag = "v1.6.0"
commit = "b7e29b9d75bd31422b00c2a446d49d7af06c328d"
license = "BSD-3-Clause"

[libjxl]
url = "https://github.com/libjxl/libjxl"
tag = "v0.12.0"
commit = "a7a9c787341cf703dede03c2009fa460cae5e5df"
license = "BSD-3-Clause"

[jpegli]
url = "https://github.com/google/jpegli"
tag = "HEAD as of 2026-10-01 (no release tags)"
commit = "031a0077f5799a6041004267fc12b956c1f52a20"
license = "BSD-3-Clause"

[libjpeg-turbo]
# The libjpeg of libultrahdr (decoding the SDR picture, encoding the gain map). The JPEG
