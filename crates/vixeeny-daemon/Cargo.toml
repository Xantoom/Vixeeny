[package]
name = "vixeeny-daemon"
description = "Vixeeny: daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
# The program people start (Start menu, autostart): its file name is the product's.
name = "Vixeeny"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
auto-launch.workspace = true
thiserror.workspace = true
tracing.workspace = true
vixeeny-common = { path = "../vixeeny-common" }
global-hotkey.workspace = true
tray-icon.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# The Windows resource (icon, version information) of the executable.
[build-dependencies]
winresource = "0.1.31"

[lints]
workspace = true
