[package]
name = "vixeeny-updater"
description = "Vixeeny: updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1.0.28"
minisign-verify = "0.3.0"
# Windows' own TLS (SChannel) and certificate store: no TLS library or root certificates of its own in the program. The
# archives are trusted for their minisign signature, not for the connection.
ureq = { version = "3.5.0", optional = true, default-features = false, features = ["native-tls-no-default", "gzip"] }
zip.workspace = true
vixeeny-common = { path = "../vixeeny-common" }
vixeeny-platform = { path = "../vixeeny-platform", optional = true }

[features]
default = ["net"]
# The network client (`client`); the daemon only reads the state.
net = ["dep:ureq", "dep:vixeeny-platform"]

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
