[package]
name = "vixeeny-updater"
description = "Vixeeny: updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = "1.0.151"
semver = "1.0.28"
sha2 = "0.11.0"
minisign-verify = "0.3.0"
ureq = { version = "3.4.2", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
vixeeny-common = { path = "../vixeeny-common" }

[features]
default = ["net"]
# The network client and the `vixeeny-updater` program; the daemon and the app only read the state.
net = ["dep:ureq"]

[[bin]]
name = "vixeeny-updater"
path = "src/main.rs"
required-features = ["net"]

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
