[package]
name = "vixeeny-updater"
description = "Vixeeny: updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1.0.28"
minisign-verify = "0.3.0"
ureq = { version = "3.4.2", optional = true }
zip.workspace = true
vixeeny-common = { path = "../vixeeny-common" }
vixeeny-platform = { path = "../vixeeny-platform", optional = true }

[features]
default = ["net"]
# The network client (`client`); the daemon only reads the state.
net = ["dep:ureq", "dep:vixeeny-platform"]

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
