[package]
name = "vixeeny-ui"
description = "Vixeeny: ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2"] }
vixeeny-editor = { path = "../vixeeny-editor" }
vixeeny-ocr = { path = "../vixeeny-ocr" }

[build-dependencies]
slint-build = "1.18.1"

[features]
# The windowing backend and GPU renderer of the real application (plan M0: FemtoVG).
desktop = ["slint/backend-winit", "slint/renderer-femtovg", "slint/accessibility"]

[dev-dependencies]
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
png.workspace = true

