[package]
name = "vixeeny-encode"
description = "Vixeeny: encode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml.workspace = true
vixeeny-common = { path = "../vixeeny-common" }

# Unix: FFmpeg built by `cargo xtask build-native`, linked statically (found via pkg-config).
[target.'cfg(not(windows))'.dependencies]
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling", "static"], optional = true }

# Windows: prebuilt shared FFmpeg (FFMPEG_DIR); its DLLs must be next to the executable.
[target.'cfg(windows)'.dependencies]
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"], optional = true }
# The D3D11 video processor that converts captured frames on the GPU.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[features]
ffmpeg-next = ["dep:ffmpeg-next"]

[dev-dependencies]
vixeeny-audio = { path = "../vixeeny-audio" }
vixeeny-capture = { path = "../vixeeny-capture" }
vixeeny-platform = { path = "../vixeeny-platform" }

[[example]]
name = "record_mac"
required-features = ["ffmpeg-next"]
