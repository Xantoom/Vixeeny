# Codec registry (plan section 6). One entry per encoder; presets are plain FFmpeg options.
# Checked against the real encoders by `cargo xtask verify-registry`.
#
# The custom preset is built from `rate_control` and `params`:
# - `rate_control.quality`: the scale of the constant-quality mode (lower = better);
# - `rate_control.modes`: the FFmpeg options of each mode (`quality`, `vbr`, `cbr`), where
#   `{quality}`, `{bitrate}`, `{maxrate}` and `{bufsize}` are replaced by the user's values
#   (rates in bit/s; the buffer is two seconds of the highest rate);
# - `params`: the other options, each always written with its value or `default`, except a
#   value equal to `auto`, which leaves the option to FFmpeg.

[[encoder]]
id = "libx264"
display_name = "x264"
family = "h264"
kind = "software"
vendor = "none"
ffmpeg_encoder = "libx264"
hw_frames = []
pixel_formats = [
  { depth = 8, chroma = "420", ffmpeg = "yuv420p" },
  { depth = 8, chroma = "422", ffmpeg = "yuv422p" },
  { depth = 8, chroma = "444", ffmpeg = "yuv444p" },
  { depth = 10, chroma = "420", ffmpeg = "yuv420p10le" },
  { depth = 10, chroma = "422", ffmpeg = "yuv422p10le" },
  { depth = 10, chroma = "444", ffmpeg = "yuv444p10le" },
]
hdr = false
containers = ["mkv", "mp4", "fmp4"]

[encoder.presets]
quality = { crf = 18, preset = "slow" }
balanced = { crf = 23, preset = "medium" }
performance = { crf = 26, preset = "veryfast" }
small = { crf = 28, preset = "slow" }

[encoder.rate_control]
quality = { name = "CRF", min = 0, max = 51, default = 23 }
modes.quality = { crf = "{quality}" }
modes.vbr = { b = "{bitrate}", maxrate = "{maxrate}", bufsize = "{bufsize}" }
modes.cbr = { b = "{bitrate}", maxrate = "{bitrate}", bufsize = "{bufsize}" }

[[encoder.params]]
key = "preset"
ffmpeg_option = "preset"
type = "enum"
values = ["ultrafast", "superfast", "veryfast", "faster", "fast", "medium", "slow", "slower", "veryslow", "placebo"]
default = "medium"

[[encoder.params]]
key = "tune"
ffmpeg_option = "tune"
type = "enum"
values = ["auto", "film", "animation", "grain", "stillimage", "fastdecode", "zerolatency"]
default = "auto"
auto = "auto"

[[encoder.params]]
key = "bframes"
ffmpeg_option = "bf"
type = "int"
min = 0
max = 16
default = 3

[[encoder.params]]
key = "lookahead"
ffmpeg_option = "rc-lookahead"
type = "int"
min = 0
max = 250
default = 40

[[encoder.params]]
key = "keyint"
ffmpeg_option = "g"
type = "int"
min = 0
max = 1000
default = 0
auto = 0


