family = "hevc"
kind = "hardware"
vendor = "intel"
ffmpeg_encoder = "hevc_qsv"
hw_frames = ["d3d11"]
pixel_formats = [
  { depth = 8, chroma = "420", ffmpeg = "nv12" },
  { depth = 10, chroma = "420", ffmpeg = "p010le" },
]
hdr = true
containers = ["mkv", "mp4", "fmp4"]

[encoder.presets]
quality = { global_quality = 20, preset = "slow" }
balanced = { global_quality = 24, preset = "medium" }
performance = { global_quality = 28, preset = "veryfast" }
small = { global_quality = 32, preset = "slow" }

[encoder.rate_control]
quality = { name = "ICQ", min = 1, max = 51, default = 24 }
modes.quality = { global_quality = "{quality}" }
modes.vbr = { b = "{bitrate}", maxrate = "{maxrate}", bufsize = "{bufsize}" }
modes.cbr = { b = "{bitrate}", maxrate = "{bitrate}", bufsize = "{bufsize}" }

[[encoder.params]]
key = "preset"
ffmpeg_option = "preset"
type = "enum"
values = ["veryfast", "faster", "fast", "medium", "slow", "slower", "veryslow"]
default = "medium"

[[encoder.params]]
key = "bframes"
ffmpeg_option = "bf"
type = "enum"
values = ["auto", "0", "1", "2", "3", "4"]
default = "auto"
auto = "auto"

[[encoder.params]]
key = "keyint"
ffmpeg_option = "g"
type = "int"
min = 0
max = 1000
default = 0
auto = 0


