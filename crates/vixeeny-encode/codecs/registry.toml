# Codec registry (plan section 6). One entry per encoder; presets are plain FFmpeg options.
# Checked against the real encoders by `cargo xtask verify-registry`.

[[encoder]]
id = "libx264"
display_name = "x264 (CPU)"
family = "h264"
kind = "software"
vendor = "none"
ffmpeg_encoder = "libx264"
platforms = ["windows", "linux", "macos"]
hw_frames = []
pixel_formats = [
  { depth = 8, chroma = "420", ffmpeg = "yuv420p" },
  { depth = 8, chroma = "422", ffmpeg = "yuv422p" },
  { depth = 8, chroma = "444", ffmpeg = "yuv444p" },
  { depth = 10, chroma = "420", ffmpeg = "yuv420p10le" },
  { depth = 10, chroma = "422", ffmpeg = "yuv422p10le" },
  { depth = 10, chroma = "444", ffmpeg = "yuv444p10le" },
]
hdr = false
containers = ["mkv", "mp4", "fmp4"]
rate_control = ["crf", "vbr", "cbr", "cqp"]

[encoder.presets]
quality = { crf = 18, preset = "slow" }
balanced = { crf = 23, preset = "medium" }
performance = { crf = 26, preset = "veryfast" }
small = { crf = 28, preset = "slow" }

[[encoder.params]]
key = "preset"
ffmpeg_option = "preset"
type = "enum"
values = ["ultrafast", "superfast", "veryfast", "faster", "fast", "medium", "slow", "slower", "veryslow", "placebo"]
default = "medium"
label = "encoder.param.preset"

[[encoder.params]]
key = "tune"
ffmpeg_option = "tune"
type = "enum"
values = ["film", "animation", "grain", "stillimage", "fastdecode", "zerolatency"]
default = "film"
label = "encoder.param.tune"

[[encoder.params]]
key = "crf"
ffmpeg_option = "crf"
type = "float"
min = 0
max = 51
default = 23
label = "encoder.param.crf"

[[encoder.params]]
key = "profile"
ffmpeg_option = "profile"
type = "enum"
values = ["baseline", "main", "high", "high10", "high422", "high444"]
default = "high"
label = "encoder.param.profile"

[[encoder.params]]
key = "keyint"
ffmpeg_option = "g"
type = "int"
min = 1
max = 10000
default = 250
label = "encoder.param.keyint"

[[encoder.params]]
key = "bframes"
ffmpeg_option = "bf"
type = "int"
min = 0
max = 16
default = 2
label = "encoder.param.bframes"

[[encoder.params]]
key = "lookahead"
ffmpeg_option = "rc-lookahead"
type = "int"
min = 0
max = 250
default = 40
label = "encoder.param.lookahead"


