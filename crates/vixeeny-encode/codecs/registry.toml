[[encoder]]
id = "libvpx_vp9"
display_name = "VP9"
family = "vp9"
kind = "software"
vendor = "none"
ffmpeg_encoder = "libvpx-vp9"
hw_frames = []
pixel_formats = [
  { depth = 8, chroma = "420", ffmpeg = "yuv420p" },
  { depth = 8, chroma = "422", ffmpeg = "yuv422p" },
  { depth = 8, chroma = "444", ffmpeg = "yuv444p" },
  { depth = 10, chroma = "420", ffmpeg = "yuv420p10le" },
  { depth = 10, chroma = "422", ffmpeg = "yuv422p10le" },
  { depth = 10, chroma = "444", ffmpeg = "yuv444p10le" },
]
hdr = false
containers = ["mkv", "mp4", "fmp4", "webm"]

[encoder.presets]
quality = { crf = 26, deadline = "good", cpu-used = 2, b = 0 }
balanced = { crf = 32, deadline = "good", cpu-used = 4, b = 0 }
performance = { crf = 36, deadline = "realtime", cpu-used = 8, b = 0 }
small = { crf = 40, deadline = "good", cpu-used = 3, b = 0 }

# Constant quality needs `b = 0`; CBR is chosen when the three rates are equal.
[encoder.rate_control]
quality = { name = "CRF", min = 0, max = 63, default = 32 }
modes.quality = { crf = "{quality}", b = 0 }
modes.vbr = { b = "{bitrate}" }
modes.cbr = { b = "{bitrate}", minrate = "{bitrate}", maxrate = "{bitrate}", bufsize = "{bufsize}" }

[[encoder.params]]
key = "deadline"
ffmpeg_option = "deadline"
type = "enum"
values = ["best", "good", "realtime"]
default = "good"

[[encoder.params]]
key = "cpu-used"
ffmpeg_option = "cpu-used"
type = "int"
min = -8
max = 8
default = 4

[[encoder.params]]
key = "row-mt"
ffmpeg_option = "row-mt"
type = "bool"
default = true

[[encoder.params]]
key = "keyint"
ffmpeg_option = "g"
type = "int"
min = 0
max = 1000
default = 0
auto = 0


