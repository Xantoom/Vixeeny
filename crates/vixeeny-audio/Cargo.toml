[package]
name = "vixeeny-audio"
description = "Vixeeny: audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
vixeeny-common = { path = "../vixeeny-common" }
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-core-media.workspace = true
objc2-core-audio-types.workspace = true
objc2-screen-capture-kit.workspace = true
vixeeny-platform = { path = "../vixeeny-platform" }

# Linux: PipeWire (behind the `pipewire` feature, which needs libpipewire-0.3 and clang to build).
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { workspace = true, optional = true }
vixeeny-platform = { path = "../vixeeny-platform" }

[features]
pipewire = ["dep:pipewire"]

# Windows: WASAPI (system loopback, microphones, per-application loopback).
[target.'cfg(windows)'.dependencies]
# The `implement` macro refers to this crate by name.
windows-core = "0.62.2"
windows = { workspace = true, features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
