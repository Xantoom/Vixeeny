[package]
name = "vixeeny-image"
description = "Vixeeny: image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jxl-oxide = { version = "0.12.6", features = ["moxcms"] }
libwebp-sys = "0.14.4"
moxcms = "0.9.1"
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
png.workspace = true
thiserror.workspace = true

[features]
# JPEG (jpegli), AVIF (libavif + SVT-AV1) and JPEG XL (libjxl) through the natively built libraries
# (`cargo xtask build-native`; PKG_CONFIG_PATH must point at its prefix).
native-codecs = ["dep:pkg-config", "dep:bindgen"]

[lints]
workspace = true

[dev-dependencies]

[build-dependencies]
bindgen = { version = "0.73.2", optional = true }
pkg-config = { version = "0.3.34", optional = true }
