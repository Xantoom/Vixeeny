[package]
name = "vixeeny-overlay"
description = "Vixeeny: the native windows (zone editor, side strip, notifications, recording widget)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
vixeeny-common = { path = "../vixeeny-common" }
vixeeny-editor = { path = "../vixeeny-editor" }
vixeeny-platform = { path = "../vixeeny-platform" }
windows-numerics = "0.3.1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
vixeeny-image = { path = "../vixeeny-image" }
png.workspace = true
vixeeny-capture = { path = "../vixeeny-capture" }
tracing-subscriber.workspace = true
