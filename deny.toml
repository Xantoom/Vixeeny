[graph]
all-features = true
# Vixeeny ships for Windows only.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
ignore = [
  # ttf-parser is unmaintained but only parses the bundled font (fontdue) and winit's window
  # decorations; revisit when fontdue or winit move to skrifa.
  "RUSTSEC-2026-0192",
]

[licenses]
version = 2
allow = [
  "GPL-3.0-or-later", "GPL-3.0-only", "MIT", "Apache-2.0",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0",
  "CDLA-Permissive-2.0", "WTFPL", "0BSD", "BSL-1.0", "Unlicense",
]

[bans]
multiple-versions = "warn"
