[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # ttf-parser is unmaintained but only parses the bundled font (fontdue) and winit's window
  # decorations; revisit when fontdue or winit move to skrifa.
  "RUSTSEC-2026-0192",
]

[licenses]
version = 2
allow = [
  "GPL-3.0-or-later", "GPL-3.0-only", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0",
  "CDLA-Permissive-2.0", "LGPL-3.0-or-later", "LGPL-2.1-or-later", "WTFPL", "0BSD", "IJG", "BSL-1.0", "Unlicense",
]

[bans]
multiple-versions = "warn"
