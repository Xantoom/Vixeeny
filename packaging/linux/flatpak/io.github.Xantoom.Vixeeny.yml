# Builds a Flatpak bundle from the programs the release workflow has already built (the `stage`
# folder written by `cargo xtask dist-linux`), plus the helpers Vixeeny runs as programs:
# wl-clipboard and xclip (the clipboard must outlive the app) and Tesseract (text recognition).
app-id: io.github.Xantoom.Vixeeny
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: vixeeny-daemon
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # PipeWire (screen casts and audio) is reached through its socket.
  - --filesystem=xdg-run/pipewire-0
  - --socket=pulseaudio
  # The tray icon, as StatusNotifierItem.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --env=TESSDATA_PREFIX=/app/share/tessdata
modules:
  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dfishcompletiondir=no
      - -Dzshcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb
  - name: libXmu
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-docs
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/archive/individual/lib/libXmu-1.2.1.tar.xz
        sha256: fcb27793248a39e5fcc5b9c4aec40cc0734b3ca76aac3d7d1c264e7f7e14e8b2
  - name: xclip
    buildsystem: simple
    build-commands:
      - autoreconf -fi
      - ./configure --prefix=/app
      - make -j"$FLATPAK_BUILDER_N_JOBS"
      - make install
    sources:
      - type: archive
        url: https://github.com/astrand/xclip/archive/refs/tags/0.13.tar.gz
        sha256: ca5b8804e3c910a66423a882d79bf3c9450b875ac8528791fb60ec9de667f758
  - name: leptonica
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DSW_BUILD=OFF
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/archive/refs/tags/1.85.0.tar.gz
        sha256: c01376bce0379d4ea4bc2ec5d5cbddaa49e2f06f88242619ab8c059e21adf233
  - name: tesseract
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSW_BUILD=OFF
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DOPENMP_BUILD=OFF
      - -DDISABLE_CURL=ON
      - -DDISABLE_ARCHIVE=ON
      - -DGRAPHICS_DISABLED=ON
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.1.tar.gz
        sha256: a7a3f2a7420cb6a6a94d80c24163e183cf1d2f1bed2df3bbc397c81808a57237
  # English and French, plus the orientation data; other languages are Tesseract's `*.traineddata`.
  - name: tessdata
    buildsystem: simple
    build-commands:
      - install -Dm644 eng.traineddata fra.traineddata osd.traineddata -t /app/share/tessdata
    sources:
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/fra.traineddata
        sha256: ced037562e8c80c13122dece28dd477d399af80911a28791a66a63ac1e3445ca
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/osd.traineddata
        sha256: 9cf5d576fcc47564f11265841e5ca839001e7e6f38ff7f7aacf46d15a96b00ff
  - name: vixeeny
    buildsystem: simple
    build-commands:
      - install -Dm755 vixeeny-daemon vixeeny-app -t /app/bin
      - install -Dm644 io.github.Xantoom.Vixeeny.desktop -t /app/share/applications
      - install -Dm644 io.github.Xantoom.Vixeeny.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 io.github.Xantoom.Vixeeny.metainfo.xml -t /app/share/metainfo
      - install -Dm644 LICENSE THIRD-PARTY-LICENSES.txt -t /app/share/licenses/io.github.Xantoom.Vixeeny
    sources:
      - type: dir
        path: stage
