name: Beta feedback
description: Tell us how Vixeeny works on your system (it is fine if everything works)
labels: [feedback]
body:
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows 11, Windows 10]
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [Installer, Portable zip]
  - type: textarea
    id: worked
    attributes:
      label: What you tried and how it went
      description: "Screenshots (region, window, full screen), recording, OCR, converting, shortcuts, tray icon…"
    validations:
      required: true
  - type: textarea
    id: sysinfo
    attributes:
      label: System info (Settings → About → Copy system info)
      render: markdown
