name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Vixeeny. In the app, **Settings → About → Report a problem** opens this
        form with the system info filled in, and selects a report file in the Explorer: drop it in
        the Logs field. Without the app: `vixeeny-app --system-info` prints the system info.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Press the region capture shortcut\n2. …"
    validations:
      required: true
  - type: textarea
    id: sysinfo
    attributes:
      label: System info
      description: Filled in by "Report a problem" (or the output of `vixeeny-app --system-info`).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drop the Vixeeny-report-….txt file that "Report a problem" selected. It holds the logs of the last days, without your user name or folders.
