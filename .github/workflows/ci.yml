name: CI
on:
  push:
    # With only `tags-ignore`, GitHub skips branches altogether: name them explicitly.
    # Tags are built by the Release workflow.
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml
  # Lint and tests run side by side (the repository is public: the minutes cost nothing), both
  # with the image codecs built natively, as for a release. The idle measurement, which needs a
  # release build, runs with the releases.
  lint:
    needs: ffmpeg
    runs-on: windows-latest
    env:
      # No debug information: less to write, link and cache.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          native: true
      - run: cargo fmt --check
      # The targets of `--all-targets` but the benchmarks (there are none): that option also
      # checks vixeeny-ui's library as a test, though its `test = false` says it has none.
      - run: cargo clippy --workspace --lib --bins --tests --examples --features vixeeny-app/native-codecs -- -D warnings
  test:
    needs: ffmpeg
    runs-on: windows-latest
    env:
      # No debug information: less to write and link (a failing test still names its line).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # LLVM's linker (shipped with Rust) links the many test programs much faster than Microsoft's.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          native: true
      # `--tests`, not `--all-targets`: that one also builds vixeeny-ui's library as a test, though
      # its `test = false` says it has none, and the code generated from the .slint files is the
      # bulk of the build. No documentation tests either: the crates have none, and their pass costs
      # a rustdoc run each. The examples are checked by clippy.
      - run: cargo test --workspace --tests --features vixeeny-app/native-codecs
      # Already run above; again for its output. The same features: nothing is built again (`-p`
      # alone would rebuild the crate and its dependencies).
      - name: Real capture smoke test (output only)
        run: cargo test --workspace --features vixeeny-app/native-codecs --test wgc_smoke -- --nocapture
  caches:
    needs: [lint, test]
    if: always() && github.ref == 'refs/heads/1.0'
    permissions:
      actions: write
    uses: ./.github/workflows/caches.yml
  installer:
    # The installer script compiles; otherwise its code is only compiled by a release.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile the installer script
        run: |
          # The image usually has Inno Setup.
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          New-Item -ItemType Directory dist\stage | Out-Null
          Copy-Item LICENSE dist\stage
          Set-Content dist\stage\files.txt "LICENSE"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q "/DStageDir=$PWD\dist\stage" "/DOutDir=$PWD\dist" packaging\windows\vixeeny.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  deny:
    # cargo-deny runs in a Linux container; it only reads the Windows dependency graph.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
