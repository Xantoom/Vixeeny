name: CI
on:
  push:
    # With only `tags-ignore`, GitHub skips branches altogether: name them explicitly.
    # Tags are built by the Release workflow.
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml
  # Lint (with the image codecs, built natively) and tests run side by side (the repository is
  # public: the minutes cost nothing). The idle measurement, which needs a release build, runs
  # with the releases.
  lint:
    needs: ffmpeg
    runs-on: windows-latest
    env:
      # No debug information: less to write, link and cache.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      PKG_CONFIG_PATH: ${{ github.workspace }}\native\build\work\prefix\lib\pkgconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # libjxl and jpegli built with MSVC, as for a release.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: native-cache
        with:
          path: native/build/work
          key: native-windows-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}
          restore-keys: native-windows-
      - uses: ./.github/actions/setup
      - run: cargo fmt --check
      - name: Tools (pkg-config, and nasm for libjpeg-turbo's SIMD when the cache has no libraries)
        run: |
          $tools = @("pkgconfiglite")
          if ("${{ steps.native-cache.outputs.cache-hit }}" -ne "true") { $tools += "nasm" }
          choco install @tools -y --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: cargo xtask build-native
      # Saved only when the libraries changed: an unchanged copy (750 MB) would only push the
      # other caches out of the 10 GB GitHub keeps per repository.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: native/build/work
          key: native-windows-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy with the image codecs
        run: cargo clippy -p vixeeny-app --features native-codecs --all-targets -- -D warnings
      - name: Image codecs (JPEG, Ultra HDR, JPEG XL)
        run: cargo test -p vixeeny-image --features native-codecs --all-targets
  test:
    needs: ffmpeg
    runs-on: windows-latest
    env:
      # No debug information: less to write and link (a failing test still names its line).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # LLVM's linker (shipped with Rust) links the many test programs much faster than Microsoft's.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # `--all-targets`: the crates have no documentation tests, whose pass costs a rustdoc run each.
      - run: cargo test --workspace --all-targets
      # Already run above; again for its output. The same targets and features: nothing is built
      # again (`-p` alone would rebuild the crate and its dependencies).
      - name: Real capture smoke test (output only)
        run: cargo test --workspace --test wgc_smoke -- --nocapture
  installer:
    # The installer script compiles; otherwise its code is only compiled by a release.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile the installer script
        run: |
          # The image usually has Inno Setup.
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          New-Item -ItemType Directory dist\stage | Out-Null
          Copy-Item LICENSE dist\stage
          Set-Content dist\stage\files.txt "LICENSE"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q "/DStageDir=$PWD\dist\stage" "/DOutDir=$PWD\dist" packaging\windows\vixeeny.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  deny:
    # cargo-deny runs in a Linux container; it only reads the Windows dependency graph.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
