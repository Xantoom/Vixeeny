name: CI
on:
  push:
    # With only `tags-ignore`, GitHub skips branches altogether: name them explicitly.
    # Tags are built by the Release workflow.
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml
  # Lint and tests run side by side (the repository is public: the minutes cost nothing).
  # The idle measurement, which needs a release build, runs with the releases.
  lint:
    needs: ffmpeg
    runs-on: windows-latest
    env:
      FFMPEG_DIR: ${{ github.workspace }}\native\build\work\ffmpeg-prebuilt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      # Every build links FFmpeg, and the tests need its DLLs.
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg
          path: native/build/work
      - name: FFmpeg
        shell: pwsh
        run: |
          cargo xtask build-native ffmpeg
          "$env:FFMPEG_DIR\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
  test:
    needs: ffmpeg
    runs-on: windows-latest
    env:
      # No debug information: less to write and link (a failing test still names its line).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # LLVM's linker (shipped with Rust) links the many test programs much faster than Microsoft's.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
      FFMPEG_DIR: ${{ github.workspace }}\native\build\work\ffmpeg-prebuilt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      # Every build links FFmpeg, and the tests need its DLLs.
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg
          path: native/build/work
      - name: FFmpeg
        shell: pwsh
        run: |
          cargo xtask build-native ffmpeg
          "$env:FFMPEG_DIR\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: cargo test --workspace
      # Already run above; again for its output. `--workspace` keeps the same features: nothing
      # is built again (`-p` alone would rebuild the crate and its dependencies).
      - name: Real capture smoke test (output only)
        run: cargo test --workspace --test wgc_smoke -- --nocapture
  deny:
    # cargo-deny runs in a Linux container; it only reads the Windows dependency graph.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
  native:
    # FFmpeg (the `ffmpeg` job), and libjxl and jpegli built with MSVC for the image codecs.
    # The same build as a release, without packaging.
    needs: ffmpeg
    runs-on: windows-latest
    env:
      # No debug information: less to write, link and cache (as in `test`).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      FFMPEG_DIR: ${{ github.workspace }}\native\build\work\ffmpeg-prebuilt
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: native/build/work
          key: native-windows-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}
          restore-keys: native-windows-
      - name: Tools (pkg-config)
        shell: pwsh
        run: |
          choco install pkgconfiglite -y --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$env:FFMPEG_DIR\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # Only to build the native libraries (libjpeg-turbo's SIMD), which the cache usually holds.
      - name: Tools (nasm)
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg
          path: native/build/work
      - run: cargo xtask build-native
      # Saved only when the libraries changed: an unchanged copy (750 MB) would only push the
      # other caches out of the 10 GB GitHub keeps per repository.
      - uses: actions/cache/save@v6
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: native/build/work
          key: native-windows-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}
      - name: The app with the image codecs (clippy)
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}\native\build\work\prefix\lib\pkgconfig
        run: cargo clippy -p vixeeny-app --features native-codecs --all-targets -- -D warnings
      - name: Image codecs (JPEG, Ultra HDR, JPEG XL)
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}\native\build\work\prefix\lib\pkgconfig
        run: cargo test -p vixeeny-image --features native-codecs
