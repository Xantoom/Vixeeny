name: CI
on:
  push:
    # With only `tags-ignore`, GitHub skips branches altogether: name them explicitly.
    # Tags are built by the Release workflow.
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Real capture smoke test (output only)
        run: cargo test -p vixeeny-capture --test wgc_smoke -- --nocapture
      - name: Idle smoke test (20 s, informational)
        continue-on-error: true
        run: |
          cargo build --release -p vixeeny-daemon -p vixeeny-app -p xtask
          target\release\xtask.exe bench-idle --seconds 20
  deny:
    # cargo-deny runs in a Linux container; it only reads the Windows dependency graph.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  native:
    # The prebuilt FFmpeg (checked by SHA-256), and SVT-AV1, dav1d and the image libraries built
    # with MSVC for libavif and the image crates. The same build as a release, without packaging.
    runs-on: windows-latest
    env:
      FFMPEG_DIR: ${{ github.workspace }}\native\build\work\ffmpeg-prebuilt
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Tools (nasm, meson, pkg-config)
        shell: pwsh
        run: |
          choco install nasm pkgconfiglite -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "C:\ProgramData\chocolatey\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$env:FFMPEG_DIR\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          pip install meson
      - uses: actions/cache/restore@v4
        with:
          path: native/build/work
          key: native-windows-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}
          restore-keys: native-windows-
      - run: cargo xtask build-native
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: native/build/work
          key: native-windows-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}-${{ github.run_id }}
      - name: Software encode matrix
        run: cargo test -p vixeeny-encode --features ffmpeg-next --test software_encode --test recorder
      - name: Registry against FFmpeg (every encoder must exist and expose the declared options)
        run: cargo test -p vixeeny-encode --features ffmpeg-next --test verify_registry -- --nocapture
      - name: The app with recording and image codecs (clippy)
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}\native\build\work\prefix\lib\pkgconfig
        run: cargo clippy -p vixeeny-app -p vixeeny-capture --features vixeeny-app/ffmpeg,vixeeny-app/native-codecs --all-targets -- -D warnings
      - name: Image codecs (AVIF, JPEG XL)
        continue-on-error: true
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}\native\build\work\prefix\lib\pkgconfig
        run: cargo test -p vixeeny-image --features native-codecs
