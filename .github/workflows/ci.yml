name: CI
on:
  push:
    # With only `tags-ignore`, GitHub skips branches altogether: name them explicitly.
    # Tags are built by the Release workflow.
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Slint needs fontconfig on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
  daemon-windows:
    # M2: release binaries for the manual NF-1/NF-2 measurement, plus a short idle smoke test.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p vixeeny-daemon -p vixeeny-app -p xtask
      - name: Real capture smoke test (output only)
        run: cargo test -p vixeeny-capture --test wgc_smoke -- --nocapture
      - name: Idle smoke test (20 s, informational)
        continue-on-error: true
        run: target\release\xtask.exe bench-idle --seconds 20
      - uses: actions/upload-artifact@v4
        with:
          name: vixeeny-m2-windows
          path: |
            target/release/vixeeny-daemon.exe
            target/release/vixeeny-app.exe
            target/release/xtask.exe
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  native-linux:
    # M1: build the pinned native libraries and run the software-encode matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake nasm meson ninja-build pkg-config
      - uses: actions/cache@v4
        with:
          path: native/build/work
          key: native-linux-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}
      - run: cargo xtask build-native
      - run: cargo test -p vixeeny-encode --features ffmpeg-next --test software_encode --test verify_registry --test recorder
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/native/build/work/prefix/lib/pkgconfig
      - name: Image codecs (AVIF, JPEG XL)
        run: cargo test -p vixeeny-image -p vixeeny-app -p vixeeny-convert --features vixeeny-image/native-codecs,vixeeny-app/native-codecs,vixeeny-convert/native-codecs
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/native/build/work/prefix/lib/pkgconfig
  native-windows:
    # Prebuilt shared FFmpeg (checked by SHA-256); dav1d, SVT-AV1 and the image libraries are
    # built with MSVC for libavif and the image crates.
    runs-on: windows-latest
    env:
      FFMPEG_DIR: ${{ github.workspace }}\native\build\work\ffmpeg-prebuilt
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Tools (nasm, meson)
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          pip install meson
      - uses: actions/cache/restore@v4
        with:
          path: native/build/work
          key: native-windows-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}
          restore-keys: native-windows-
      - run: cargo xtask build-native
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: native/build/work
          key: native-windows-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}-${{ github.run_id }}
      - name: Software encode matrix
        shell: pwsh
        run: |
          $env:PATH = "$env:FFMPEG_DIR\bin;$env:PATH"
          cargo test -p vixeeny-encode --features ffmpeg-next --test software_encode --test recorder
      - name: Recording app (Windows capture + recorder) compiles
        shell: pwsh
        run: |
          $env:PATH = "$env:FFMPEG_DIR\bin;$env:PATH"
          cargo clippy -p vixeeny-app -p vixeeny-capture --features vixeeny-app/ffmpeg --all-targets -- -D warnings
      - name: Registry against FFmpeg (every Windows encoder must exist and expose the declared options)
        shell: pwsh
        run: |
          $env:PATH = "$env:FFMPEG_DIR\bin;$env:PATH"
          cargo test -p vixeeny-encode --features ffmpeg-next --test verify_registry -- --nocapture
      - name: Image codecs (AVIF, JPEG XL)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install pkgconfiglite -y --no-progress
          $env:PATH = "$env:PATH;C:\ProgramData\chocolatey\bin"
          pkg-config --version
          Get-ChildItem "${{ github.workspace }}\native\build\work\prefix\lib" -Filter *.lib | Select-Object -ExpandProperty Name
          Get-Content "${{ github.workspace }}\native\build\work\prefix\lib\pkgconfig\libjxl.pc"
          Get-Content "${{ github.workspace }}\native\build\work\prefix\lib\pkgconfig\libavif.pc"
          $env:PKG_CONFIG_PATH = "${{ github.workspace }}\native\build\work\prefix\lib\pkgconfig"
          cargo test -p vixeeny-image --features native-codecs
  native-macos:
    # Native arch of the runner (arm64); the universal binary is a later milestone.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: brew install cmake nasm meson ninja pkgconf
      - uses: actions/cache/restore@v4
        with:
          path: native/build/work
          key: native-macos-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}
          restore-keys: native-macos-
      - run: cargo xtask build-native
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: native/build/work
          key: native-macos-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}-${{ github.run_id }}
      - run: cargo test -p vixeeny-encode --features ffmpeg-next --test software_encode --test verify_registry --test recorder
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/native/build/work/prefix/lib/pkgconfig
      - name: Image codecs (AVIF, JPEG XL)
        run: cargo test -p vixeeny-image -p vixeeny-app -p vixeeny-convert --features vixeeny-image/native-codecs,vixeeny-app/native-codecs,vixeeny-convert/native-codecs
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/native/build/work/prefix/lib/pkgconfig
