name: Release
# Builds the Windows packages (installer, update archive, portable archive), signs them and
# prepares the draft GitHub release `v<version of Cargo.toml>`, whose tag is made when the draft
# is published. It runs on the release branch when the version changes (and by hand), not on a
# tag: a tag cannot read the caches of the branch, and every release would build everything from
# nothing (~25 min). A version that already has a release is not built again.
on:
  push:
    branches: ["1.0"]
    paths: ["Cargo.toml"]
  workflow_dispatch:
    inputs:
      release:
        description: Prepare the draft release (off = build the files only)
        type: boolean
        default: true
# Read only; the job that signs and drafts the release is the one that writes.
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! gh release view "v$version" >/dev/null 2>&1; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo "v$version already has a release: nothing to build."
            echo build=false >> "$GITHUB_OUTPUT"
          fi
  ffmpeg:
    needs: version
    if: needs.version.outputs.build == 'true'
    uses: ./.github/workflows/ffmpeg.yml
  windows:
    needs: [version, ffmpeg]
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    env:
      FFMPEG_DIR: ${{ github.workspace }}\native\build\work\ffmpeg-prebuilt
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: native-cache
        with:
          path: native/build/work
          key: native-windows-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}
          restore-keys: native-windows-
      - name: Tools (Inno Setup, pkg-config)
        shell: pwsh
        run: |
          # The image usually has Inno Setup: only what is missing is installed.
          $missing = @()
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { $missing += "innosetup" }
          if (-not (Test-Path "C:\ProgramData\chocolatey\bin\pkg-config.exe")) { $missing += "pkgconfiglite" }
          if ($missing) { choco install @missing -y --no-progress }
          "C:\ProgramData\chocolatey\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$env:FFMPEG_DIR\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # Only to build the native libraries (libjpeg-turbo's SIMD), which the cache usually holds.
      - name: Tools (nasm)
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg
          path: native/build/work
      - run: cargo xtask build-native
      # One invocation: the crates the programs share are built once, side by side with the rest.
      - name: Build the programs
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "${{ github.workspace }}\native\build\work\prefix\lib\pkgconfig"
          cargo build --release -p vixeeny-daemon -p xtask -p vixeeny-app --features vixeeny-app/native-codecs
      # The release build of xtask, built above: its compression is many times faster.
      - name: Package (stage, update archive, portable archive)
        shell: pwsh
        run: target\release\xtask.exe dist --out dist
      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          iscc "/DAppVersion=$version" "/DStageDir=$PWD\dist\stage" "/DOutDir=$PWD\dist" packaging\windows\vixeeny.iss
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vixeeny-windows-unsigned
          path: |
            dist/*.zip
            dist/*.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xtask
          path: target/release/xtask.exe
          retention-days: 1
  # Idle CPU and wake-ups of the daemon being released (informational), on a machine of its own:
  # the release does not wait for it.
  idle:
    needs: windows
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vixeeny-windows-unsigned
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask
          path: xtask
      - name: Idle smoke test (20 s)
        shell: pwsh
        run: |
          Expand-Archive (Get-Item dist\*-portable.zip).FullName -DestinationPath app
          xtask\xtask.exe bench-idle --seconds 20 --daemon app\Vixeeny.exe
  # Signing runs apart, on a fresh machine that runs nothing else: no build script, no
  # third-party action and no package of the build can reach the key.
  sign:
    needs: windows
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # To read the result of CI on the commit.
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vixeeny-windows-unsigned
          path: dist
      # Built from crates.io once per version; the cache of this branch is written only by its
      # own workflows.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: rsign
        with:
          path: ~/.cargo/bin/rsign
          key: rsign2-0.6.7-${{ runner.os }}
      - name: Install rsign2
        if: steps.rsign.outputs.cache-hit != 'true'
        run: cargo install rsign2 --version 0.6.7 --locked
      # The release holds the installer and the portable archive, which updates install too;
      # their signatures go in the notes, in comments the page does not show (the updater reads
      # them there: the installer's for the move to Program Files).
      - name: Sign (minisign)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          RELEASE: ${{ github.event_name == 'push' || inputs.release }}
        run: |
          # Unsigned files cannot be installed by the updater: a release must not go without.
          if [ -z "$MINISIGN_KEY" ]; then
            if [ "$RELEASE" = true ]; then echo "::error::No MINISIGN_KEY secret: a release cannot be signed."; exit 1; fi
            echo "::warning::No MINISIGN_KEY secret: the files are not signed."; exit 0
          fi
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          sign() {
            if [ -n "$MINISIGN_PASSWORD" ]; then
              printf '%s' "$MINISIGN_PASSWORD" | rsign sign -s "$key" -x "$1.minisig" "$1"
            else
              rsign sign -W -s "$key" -x "$1.minisig" "$1"
            fi
          }
          : > dist/notes.md
          for file in dist/*-portable.zip dist/*-setup.exe; do
            sign "$file"
            {
              printf '<!-- minisign %s\n' "$(basename "$file")"
              cat "$file.minisig"
              printf '\n-->\n'
            } >> dist/notes.md
            rm "$file.minisig"
          done
          rm "$key"
          # The update archive is what the portable one is made from: not published.
          find dist -maxdepth 1 -name '*.zip' ! -name '*-portable.zip' -delete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vixeeny-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/notes.md
      # The tests of this commit ran in CI, side by side with this build: a release waits for
      # them to pass.
      - name: CI passed on this commit
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run=$(gh run list --workflow ci.yml --commit "${{ github.sha }}" --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then echo "::error::CI did not run on this commit."; exit 1; fi
          gh run watch "$run" --interval 10 --exit-status
      - name: Draft release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(ls dist/Vixeeny-*-setup.exe | sed 's/.*Vixeeny-\(.*\)-setup\.exe/\1/')
          gh release create "v$version" --title "Vixeeny $version" --target "${{ github.sha }}" --draft --notes-file dist/notes.md dist/*-setup.exe dist/*-portable.zip
