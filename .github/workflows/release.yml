name: Release
# Builds the Windows packages (installer, update archive, portable archive), signs them and
# prepares the draft GitHub release `v<version of Cargo.toml>`, whose tag is made when the draft
# is published. It runs on the release branch when the version changes (and by hand), not on a
# tag: a tag cannot read the caches of the branch, and every release would build everything from
# nothing (~25 min). A version that already has a release is not built again.
on:
  push:
    branches: ["1.0"]
    paths: ["Cargo.toml"]
  workflow_dispatch:
    inputs:
      release:
        description: Prepare the draft release (off = build the files only)
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! gh release view "v$version" >/dev/null 2>&1; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo "v$version already has a release: nothing to build."
            echo build=false >> "$GITHUB_OUTPUT"
          fi
  windows:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    env:
      FFMPEG_DIR: ${{ github.workspace }}\native\build\work\ffmpeg-prebuilt
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Tools (nasm, meson, Inno Setup)
        shell: pwsh
        run: |
          choco install nasm innosetup pkgconfiglite -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "C:\ProgramData\chocolatey\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$env:FFMPEG_DIR\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          pip install meson
      - uses: actions/cache/restore@v4
        with:
          path: native/build/work
          key: native-windows-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}
          restore-keys: native-windows-
      - run: cargo xtask build-native
      - name: Build the programs
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "${{ github.workspace }}\native\build\work\prefix\lib\pkgconfig"
          cargo build --release -p vixeeny-daemon -p xtask
          cargo build --release -p vixeeny-app --features native-codecs
      - name: Package (stage, update archive, portable archive)
        shell: pwsh
        run: cargo xtask dist --out dist
      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          iscc "/DAppVersion=$version" "/DStageDir=$PWD\dist\stage" "/DOutDir=$PWD\dist" packaging\windows\vixeeny.iss
      - name: Checksums
        shell: pwsh
        run: cargo xtask sums dist
      - name: Sign (minisign)
        shell: pwsh
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if (-not $env:MINISIGN_KEY) { Write-Warning "No MINISIGN_KEY secret: the files are not signed."; exit 0 }
          cargo install rsign2 --locked
          Set-Content -Path "$env:RUNNER_TEMP\minisign.key" -Value $env:MINISIGN_KEY
          Get-ChildItem dist -File | Where-Object { $_.Extension -in ".zip", ".exe" } | ForEach-Object {
            if ($env:MINISIGN_PASSWORD) {
              $env:MINISIGN_PASSWORD | rsign sign -s "$env:RUNNER_TEMP\minisign.key" -x "$($_.FullName).minisig" $_.FullName
            } else {
              rsign sign -W -s "$env:RUNNER_TEMP\minisign.key" -x "$($_.FullName).minisig" $_.FullName
            }
          }
          Remove-Item "$env:RUNNER_TEMP\minisign.key"
      - uses: actions/upload-artifact@v4
        with:
          name: vixeeny-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.minisig
            dist/SHA256SUMS
      - name: Draft release
        if: github.event_name == 'push' || inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in ".zip", ".exe", ".minisig" -or $_.Name -eq "SHA256SUMS" } | ForEach-Object { $_.FullName }
          gh release create "v$version" --target "${{ github.sha }}" --draft --generate-notes @files
