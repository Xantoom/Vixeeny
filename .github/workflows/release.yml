name: Release
# Builds the Windows packages (installer, update archive, portable archive), signs them and
# prepares the draft GitHub release `v<version of Cargo.toml>`, whose tag is made when the draft
# is published. It runs on the release branch when the version changes (and by hand), not on a
# tag: a tag cannot read the caches of the branch, and every release would build everything from
# nothing (~25 min). A version that already has a release is not built again; when the
# dependencies change, the programs are only built, so that the cache holds them for the next
# release.
on:
  push:
    branches: ["1.0"]
    paths: ["Cargo.toml", "Cargo.lock"]
  workflow_dispatch:
    inputs:
      release:
        description: Prepare the draft release (off = build the files only)
        type: boolean
        default: true
# Read only; the job that signs and drafts the release is the one that writes.
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      warm: ${{ steps.check.outputs.warm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! gh release view "v$version" >/dev/null 2>&1; then
            # The notes are built into the programs and make the release's: both languages first.
            for lang in en fr; do
              if [ ! -s "changelog/$version/$lang.md" ]; then
                echo "::error::changelog/$version/$lang.md is missing: a release needs its notes in English and French."
                exit 1
              fi
            done
            echo build=true >> "$GITHUB_OUTPUT"
          elif gh api "repos/$GH_REPO/compare/$BEFORE...${{ github.sha }}" --jq '.files[].filename' | grep -qx Cargo.lock; then
            echo "v$version already has a release; the dependencies changed: build only, for the cache."
            echo warm=true >> "$GITHUB_OUTPUT"
          else
            echo "v$version already has a release: nothing to build."
          fi
  ffmpeg:
    needs: version
    if: needs.version.outputs.build == 'true' || needs.version.outputs.warm == 'true'
    uses: ./.github/workflows/ffmpeg.yml
  windows:
    needs: [version, ffmpeg]
    if: needs.version.outputs.build == 'true' || needs.version.outputs.warm == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          native: true
      - uses: ./.github/actions/inno-setup
        if: needs.version.outputs.build == 'true'
      # One invocation: the crates the programs share are built once, side by side with the rest.
      - name: Build the programs
        run: cargo build --release -p vixeeny-daemon -p xtask -p vixeeny-app --features vixeeny-app/native-codecs
      # The release build of xtask, built above: its compression is many times faster.
      - name: Package (stage, update archive, portable archive, symbols)
        if: needs.version.outputs.build == 'true'
        run: target\release\xtask.exe dist --out dist
      - name: Installer
        if: needs.version.outputs.build == 'true'
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          iscc "/DAppVersion=$version" "/DStageDir=$PWD\dist\stage" "/DOutDir=$PWD\dist" packaging\windows\vixeeny.iss
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.version.outputs.build == 'true'
        with:
          name: vixeeny-windows-unsigned
          path: |
            dist/*.zip
            dist/*.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.version.outputs.build == 'true'
        with:
          name: xtask
          path: target/release/xtask.exe
          retention-days: 1
  caches:
    needs: windows
    if: always() && github.ref == 'refs/heads/1.0' && needs.windows.result != 'skipped'
    permissions:
      actions: write
    uses: ./.github/workflows/caches.yml
  # Idle CPU and wake-ups of the daemon being released (informational), on a machine of its own:
  # the release does not wait for it.
  idle:
    needs: [version, windows]
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vixeeny-windows-unsigned
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xtask
          path: xtask
      - name: Idle smoke test (20 s)
        run: |
          Expand-Archive (Get-Item dist\*-portable.zip).FullName -DestinationPath app
          xtask\xtask.exe bench-idle --seconds 20 --daemon app\Vixeeny.exe
  # Signing runs apart, on a fresh machine that runs nothing else: no build script, no
  # third-party action and no package of the build can reach the key.
  sign:
    needs: [version, windows]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
      # To read the result of CI on the commit.
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vixeeny-windows-unsigned
          path: dist
      # The notes only (files to read, nothing that runs).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: changelog
          sparse-checkout-cone-mode: true
          path: source
      # Built from crates.io (its pinned dependencies) by this job: a program restored from a cache
      # that other jobs can write would hold the signing key.
      - name: Install rsign2
        run: cargo install rsign2 --version 0.6.7 --locked
      # The release holds the installer and the portable archive, which updates install too;
      # their signatures go in the notes, in comments the page does not show (the updater reads
      # them there: the installer's for the move to Program Files). The notes are the English
      # ones of changelog/<version>/; the French ones go in a comment too. `latest.json` holds
      # the same (version, notes, files, signatures) for the updater, which reads it from
      # GitHub's download servers rather than from its API (limited to 60 requests an hour).
      - name: Sign (minisign)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          RELEASE: ${{ github.event_name == 'push' || inputs.release }}
        run: |
          # Unsigned files cannot be installed by the updater: a release must not go without.
          if [ -z "$MINISIGN_KEY" ]; then
            if [ "$RELEASE" = true ]; then echo "::error::No MINISIGN_KEY secret: a release cannot be signed."; exit 1; fi
            echo "::warning::No MINISIGN_KEY secret: the files are not signed."; exit 0
          fi
          key="$RUNNER_TEMP/minisign.key"
          # Readable by this user only, and gone however the step ends.
          umask 077
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          sign() {
            if [ -n "$MINISIGN_PASSWORD" ]; then
              printf '%s' "$MINISIGN_PASSWORD" | rsign sign -s "$key" -x "$1.minisig" "$1"
            else
              rsign sign -W -s "$key" -x "$1.minisig" "$1"
            fi
          }
          version=$(ls dist/Vixeeny-*-setup.exe | sed 's/.*Vixeeny-\(.*\)-setup\.exe/\1/')
          en="source/changelog/$version/en.md"
          fr="source/changelog/$version/fr.md"
          {
            cat "$en"
            printf '\n<!-- notes fr\n'
            cat "$fr"
            printf '\n-->\n'
          } > dist/notes.md
          files='[]'
          for file in dist/*-portable.zip dist/*-setup.exe; do
            sign "$file"
            {
              printf '<!-- minisign %s\n' "$(basename "$file")"
              cat "$file.minisig"
              printf '\n-->\n'
            } >> dist/notes.md
            files=$(jq --arg name "$(basename "$file")" --argjson size "$(stat -c %s "$file")" \
              --rawfile signature "$file.minisig" '. + [{name: $name, size: $size, signature: $signature}]' <<< "$files")
            rm "$file.minisig"
          done
          rm "$key"
          jq -n --arg version "$version" --rawfile en "$en" --rawfile fr "$fr" --argjson files "$files" \
            '{version: $version, notes: {en: $en, fr: $fr}, files: $files}' > dist/latest.json
          # The update archive is what the portable one is made from: not published.
          find dist -maxdepth 1 -name '*.zip' ! -name '*-portable.zip' ! -name '*-symbols.zip' -delete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vixeeny-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/notes.md
            dist/latest.json
      # The tests of this commit ran in CI, side by side with this build: a release waits for
      # them to pass.
      - name: CI passed on this commit
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run=$(gh run list --workflow ci.yml --commit "${{ github.sha }}" --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then echo "::error::CI did not run on this commit."; exit 1; fi
          gh run watch "$run" --interval 10 --exit-status
      # Only the installer and the portable archive are published. The symbols (the linker's maps
      # of this build) stay in this run's files: the programs carry no debug information, and only
      # these maps name the addresses of a crash of this version (`cargo xtask symbolize`).
      - name: Draft release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(ls dist/Vixeeny-*-setup.exe | sed 's/.*Vixeeny-\(.*\)-setup\.exe/\1/')
          gh release create "v$version" --title "Vixeeny $version" --target "${{ github.sha }}" --draft --notes-file dist/notes.md dist/*-setup.exe dist/*-portable.zip dist/latest.json
