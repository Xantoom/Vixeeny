name: FFmpeg
# The FFmpeg Vixeeny ships, built by `packaging/ffmpeg/build.sh` (pinned image and commit) only
# when the cache has none for that script, then handed to the Windows jobs of the calling run as
# the `ffmpeg` artifact. Nothing is published.
on:
  workflow_call:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/ffmpeg.zip
          key: ffmpeg-${{ hashFiles('packaging/ffmpeg/build.sh') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: packaging/ffmpeg/build.sh dist/ffmpeg.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg
          path: dist/ffmpeg.zip
          retention-days: 7
