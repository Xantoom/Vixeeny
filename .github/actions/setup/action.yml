name: Setup
description: >-
  For the Windows jobs: the Rust of rust-toolchain.toml, the build cache, the MSVC tools and FFmpeg (the `ffmpeg`
  artifact of the run, on the PATH for the tests); with `native`, the image libraries as well.
inputs:
  native:
    description: libjxl and jpegli built with MSVC, as for a release, for `--features vixeeny-app/native-codecs`.
    default: "false"
runs:
  using: composite
  steps:
    # The installed libraries, their stamps (a library whose stamp matches is not built again) and pkg-config: 11 MB,
    # where their sources and build folders are 600 MB more, which a build only needs when it changes.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.native == 'true'
      id: native-cache
      with:
        path: |
          native/build/work/prefix
          native/build/work/turbo-prefix
          native/build/work/*.stamp
          native/build/work/tools
        key: native-prefix-windows-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}
        restore-keys: native-prefix-windows-
    - shell: pwsh
      run: rustup toolchain install --profile minimal
    # Every CARGO*, RUST*, CC*, CFLAGS*, CXX* and CMAKE* variable of the job is part of the key, which no input narrows:
    # one added, removed or changed (by the workflow or by an action) means a build from nothing. Saved from the 1.0
    # branch only, whose caches its pull requests read: another branch's would only push them out of the 10 GB GitHub
    # keeps.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        save-if: ${{ github.ref == 'refs/heads/1.0' }}
    # The environment of a Visual Studio developer prompt (64-bit tools), for the jobs' later steps: what vcvars64.bat
    # adds or changes.
    - name: MSVC tools
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw "No Visual Studio with the C++ tools" }
        $vars = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
        if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
        foreach ($line in $vars) {
          $name, $value = $line -split "=", 2
          if ($value -and [Environment]::GetEnvironmentVariable($name) -ne $value) {
            "$name=$value" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }
        }
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ffmpeg
        path: native/build/work
    - name: FFmpeg
      shell: pwsh
      run: |
        cargo xtask build-native ffmpeg
        $dir = "$PWD\native\build\work\ffmpeg-prebuilt"
        "FFMPEG_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        "$dir\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
    - name: Image libraries (pkg-config, and nasm for libjpeg-turbo's SIMD when the cache has none)
      if: inputs.native == 'true'
      shell: pwsh
      run: |
        # pkg-config-lite is one program, kept in the cache: Chocolatey takes 15 s to install it.
        $tools = "$PWD\native\build\work\tools"
        $missing = @()
        if (-not (Test-Path "$tools\pkg-config.exe")) { $missing += "pkgconfiglite" }
        if ("${{ steps.native-cache.outputs.cache-hit }}" -ne "true") { $missing += "nasm" }
        if ($missing) { choco install @missing -y --no-progress }
        if (-not (Test-Path "$tools\pkg-config.exe")) {
          New-Item -ItemType Directory -Force $tools | Out-Null
          Copy-Item (Get-ChildItem C:\ProgramData\chocolatey\lib\pkgconfiglite -Recurse -Filter pkg-config.exe)[0].FullName $tools
        }
        $env:PATH = "$tools;C:\Program Files\NASM;$env:PATH"
        $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
        $env:PKG_CONFIG_PATH = "$PWD\native\build\work\prefix\lib\pkgconfig"
        cargo xtask build-native
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $tools | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        "LIBCLANG_PATH=$env:LIBCLANG_PATH" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
    # Saved only when the libraries changed.
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.native == 'true' && steps.native-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/1.0'
      with:
        path: |
          native/build/work/prefix
          native/build/work/turbo-prefix
          native/build/work/*.stamp
          native/build/work/tools
        key: native-prefix-windows-${{ hashFiles('native/versions.toml', 'xtask/src/native.rs') }}
