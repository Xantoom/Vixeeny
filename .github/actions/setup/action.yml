name: Setup
description: >-
  For the Windows jobs: the Rust of rust-toolchain.toml, the build cache, the MSVC tools and FFmpeg (the `ffmpeg`
  artifact of the run, on the PATH for the tests).
runs:
  using: composite
  steps:
    - shell: pwsh
      run: rustup toolchain install --profile minimal
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ffmpeg
        path: native/build/work
    - name: FFmpeg
      shell: pwsh
      run: |
        cargo xtask build-native ffmpeg
        $dir = "$PWD\native\build\work\ffmpeg-prebuilt"
        "FFMPEG_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        "$dir\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
